{% extends 'base.html' %}
{% block content %}
    <main>
    <div class="screen">
        <img src="/static/images/todo_img.png" alt="포켓몬 도감" class="dex-logo">
        <h2 class="section-heading">정말 놓아줄까요?</h2>
        <p class="task-preview">No.{{ '%03d' % todo.id }} &middot; {{ todo.task }}</p>
        <form action="/delete/{{ todo.id }}" method="post">
            <button type="submit" class="btn-secondary">놓아주기</button>
        </form>
    </div>
    </main>
{% endblock %}
